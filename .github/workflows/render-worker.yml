name: Render worker
# Independent render worker (never runs on Vercel). Started by the PWA via
# workflow_dispatch when a job is queued; a sparse schedule picks up anything
# left over (e.g. after an interrupted run). Exits as soon as the queue is empty.
on:
  workflow_dispatch:
    inputs:
      reason: { description: "why", required: false, default: "manual" }
  schedule:
    - cron: "17 */4 * * *"

concurrency:
  group: render-worker
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults: { run: { working-directory: worker } }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_BUCKET: studio
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Queue check (cheap exit)
        working-directory: .
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "SUPABASE secrets not configured"; exit 0; fi
          n=$(curl -s "$SUPABASE_URL/rest/v1/jobs?select=id&status=in.(queued,running)&limit=1" \
               -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | grep -c '"id"' || true)
          echo "pending=$n" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: env.pending != '0'
      - uses: actions/setup-python@v5
        if: env.pending != '0'
        with: { python-version: "3.12", cache: pip, cache-dependency-path: worker/requirements.txt }
      - uses: actions/setup-node@v4
        if: env.pending != '0'
        with: { node-version: 22, cache: npm, cache-dependency-path: remotion/package-lock.json }
      - uses: actions/cache@v4
        if: env.pending != '0'
        with: { path: worker/.models, key: models-v1 }
      - if: env.pending != '0'
        run: bash bin/setup_worker.sh
      - name: Process queue
        if: env.pending != '0'
        run: python -m studio worker --max-jobs 6 --idle-exit 90
# registered on default branch
