name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: worker/requirements.txt }
      - uses: actions/cache@v4
        with: { path: worker/.models, key: models-v1 }
      - run: bash bin/setup_worker.sh
      - run: python -m pytest -q tests

  web-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  remotion-typecheck:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: remotion } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: remotion/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
